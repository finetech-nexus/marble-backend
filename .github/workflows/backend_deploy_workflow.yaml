# Build and push the Marble backend image to Docker Hub.
# Tags: the requested version and the short commit SHA.
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push back-end

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: Tag to publish
        required: true
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build_and_deploy_backend:
    name: Build and push back-end
    runs-on: ubuntu-latest
    env:
      DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}
      IMAGE_NAME: marble-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "MARBLE_VERSION=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MARBLE_VERSION=${{ steps.version.outputs.MARBLE_VERSION }}
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
